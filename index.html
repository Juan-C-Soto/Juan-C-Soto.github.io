<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My Portfolio Page</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1>My Portfolio Page</h1>
       <p>This is a portfolio page highlighting <strong>labs, scripts and certifications</strong> done by Juan Soto</p>
       <div class="resume-section">
           <h2>Resume</h2>
           <div class="resume-dropdown">
               <a href="ResumeJuanSoto.html" target="_blank">View HTML Resume</a>
               <a href="assets/Resume-Juan-Soto.pdf" download>Download PDF Version</a>
           </div>
       </div>
       <div class="certifications-section">
           <h3>Certifications</h3>
           <div class="certifications-dropdown">
               <div class="certifications">
                   <div class="cert">
                       <strong>CompTIA Security+</strong> - July 2024<br>
                       <img src="assets/security.png" alt="CompTIA Security+ Badge" width="100">
                   </div>
                   <div class="cert">
                       <strong>CompTIA Network+</strong> - October 2025<br>
                       <img src="assets/network.png" alt="CompTIA Network+ Badge" width="100">
                   </div>
               </div>
           </div>
       </div>
        <div class="Labs-section">
            <h4>Labs</h4>
            <div class="Labs-dropdown">
                <div class="lab">
                    <strong>LabEx</strong>
                    <div class="lab-gallery">
                       <div class="lab-img-wrapper" onclick="openLightbox('assets/Lab1.png', 'LabEx Screenshot 1')">
                           <img src="assets/Lab1.png" alt="LabEx Screenshot 1">
                           <div class="lab-img-caption">Lab 1</div>
                       </div>
                        <div class="lab-img-wrapper" onclick="openLightbox('assets/Lab2.png', 'LabEx Screenshot 2')">
                            <img src="assets/Lab2.png" alt="LabEx Screenshot 2">
                            <div class="lab-img-caption">Lab 2</div>
                        </div>
                        <div class="lab-img-wrapper" onclick="openLightbox('assets/Lab3.png', 'LabEx Screenshot 3')">
                            <img src="assets/Lab3.png" alt="LabEx Screenshot 3">
                            <div src="lab-img-caption">Lab 3</div>
                        </div>
                </div>
            </div>
            </div>
        </div>
        <div id="lightbox" onclick="closelightbox()">
            <div id="lightbox-box">
                <img id="lightbox-img" src="" alt="">
                <p id="lightbox-caption"></p>
                <button id="lightbox-close" onclick="closelightbox()">X Close</button>
            </div>
        </div>
        <script>
            function openLightbox(src, caption) {
                document.getElementById('Lightbox-img').src = src;
                document.getElementById('lightbox-caption').textContent = caption;
                document.getElementById('Lightbox').classList.add('active');
            }
            function closeLightbox() {
                document.getElementById('Lightbox').classList.remove('active')
            }
        </script>
    </body>
</html>
